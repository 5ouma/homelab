name: 🚸 pre-commit

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: 🚸 pre-commit
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: 🚸 Run pre-commit
        uses: 5ouma/utils/pre-commit@54b168c10fa69b079dd1fa90a94258f07b9cdca2 # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
