name: 🚸 pre-commit

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: 🚸 pre-commit
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: 🚸 Run pre-commit
        uses: 5ouma/utils/pre-commit@b794f89a8b935dc20905edd7654b7fd39d20b119 # v0.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
